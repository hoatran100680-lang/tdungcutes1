<!DOCTYPE html>
<button onclick="activateKey()">⚡ KÍCH HOẠT KEY</button>

<div class="box">
<h3>GAMING FEATURES</h3>

<div class="feature">
<span>🌈 FIX RUNG BÁM</span>
<div class="toggle"></div>
</div>

<div class="feature">
<span>🎯 AIM TRAINING</span>
<div class="toggle"></div>
</div>

<div class="feature">
<span>📱 NHẠY MÀN</span>
<div class="toggle"></div>
</div>

<div class="feature">
<span>TĂNG TỈ LỆ HS</span>
<div class="toggle"></div>
</div>

<div class="feature">
<span>SENSI</span>
<div class="toggle"></div>
</div>
</div>

<button onclick="connectServer()">☁ KẾT NỐI SERVER</button>
<button onclick="startLauncher()">🚀 START LAUNCHER</button>
</div>

<script>
function activateKey(){
const key = document.getElementById('keyInput').value.trim();

if(!key){
alert('Vui lòng nhập key');
return;
}

localStorage.setItem('gaming_key',key);
alert('PREMIUM ACTIVE');
}

function connectServer(){
alert('KẾT NỐI SERVER THÀNH CÔNG');
}

function startLauncher(){
alert('LAUNCHER STARTED');
}

console.assert(typeof activateKey === 'function');
console.assert(typeof connectServer === 'function');
console.assert(typeof startLauncher === 'function');
</script>

</body>
</html>
