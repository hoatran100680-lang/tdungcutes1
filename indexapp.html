<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FF MENU</title>

<style>

body{
    background:#111;
    font-family:Arial;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:320px;
    background:#1d1d1d;
    padding:20px;
    border-radius:15px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:red;
    color:white;
    cursor:pointer;
}

.menu{
    display:none;
    margin-top:20px;
}

.feature{
    background:#2a2a2a;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

</style>
</head>

<body>

<div class="box">

<h2>FF MENU LOGIN</h2>

<input
type="text"
id="key"
placeholder="Nhập key..."
>

<button onclick="login()">
LOGIN
</button>

<h3 id="status"></h3>

<div class="menu" id="menu">

<div class="feature">AIMBOT</div>
<div class="feature">AIM HEAD</div>
<div class="feature">NO RECOIL</div>
<div class="feature">SENSI</div>
<div class="feature">KHOÁ TÂM</div>

</div>

</div>

<script>

let deviceId =
localStorage.getItem("device");

if(!deviceId){

    deviceId =
    "DEV-" +
    Math.random()
    .toString(36)
    .substring(2,12);

    localStorage.setItem(
        "device",
        deviceId
    );
}

async function login(){

    const key =
    document.getElementById("key").value;

    const req =
    await fetch(
        "http://localhost:3000/login",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                key:key,
                device:deviceId
            })
        }
    );

    const data = await req.json();

    document.getElementById(
        "status"
    ).innerHTML = data.message;

    if(data.success){

        document.getElementById(
            "menu"
        ).style.display = "block";
    }
}

</script>

</body>
</html>
