<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iOS Gaming Panel</title>

<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'SF Pro Display',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:
    linear-gradient(135deg,#0f172a,#020617);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* BACKGROUND GLOW */

.glow1,
.glow2{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
}

.glow1{
    width:300px;
    height:300px;
    background:#00d4ff55;
    top:-50px;
    left:-50px;
}

.glow2{
    width:350px;
    height:350px;
    background:#7c3aed55;
    bottom:-100px;
    right:-100px;
}

/* PANEL */

.panel{
    position:relative;
    width:420px;
    padding:28px;
    border-radius:35px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:
    0 0 40px rgba(0,212,255,0.15),
    inset 0 0 20px rgba(255,255,255,0.05);
    color:white;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:28px;
    font-weight:700;
    background:linear-gradient(90deg,#00d4ff,#7c3aed);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.online{
    color:#00ff99;
    font-size:14px;
}

/* INPUT */

.key-box{
    margin-bottom:25px;
}

.key-box input{
    width:100%;
    padding:16px;
    border:none;
    outline:none;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
    color:white;
    font-size:15px;
    border:1px solid rgba(255,255,255,0.12);
}

/* FEATURES */

.feature{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    margin-bottom:14px;
    border-radius:22px;
    background:rgba(255,255,255,0.05);
    transition:0.3s;
}

.feature:hover{
    transform:scale(1.02);
    background:rgba(255,255,255,0.08);
}

.left h3{
    font-size:16px;
    margin-bottom:5px;
}

.left p{
    font-size:12px;
    color:#bbb;
}

/* SWITCH */

.switch{
    width:58px;
    height:32px;
    border-radius:20px;
    background:#555;
    position:relative;
    cursor:pointer;
    transition:0.3s;
}

.switch::before{
    content:'';
    position:absolute;
    width:26px;
    height:26px;
    background:white;
    border-radius:50%;
    top:3px;
    left:3px;
    transition:0.3s;
}

.switch.active{
    background:linear-gradient(90deg,#00d4ff,#7c3aed);
}

.switch.active::before{
    left:29px;
}

/* BUTTON */

.activate{
    width:100%;
    padding:18px;
    border:none;
    border-radius:22px;
    margin-top:20px;
    font-size:17px;
    font-weight:600;
    color:white;
    background:linear-gradient(90deg,#00d4ff,#7c3aed);
    cursor:pointer;
    transition:0.3s;
}

.activate:hover{
    transform:scale(1.03);
    box-shadow:0 0 25px #00d4ff88;
}

/* PROGRESS */

.loading{
    margin-top:20px;
    display:none;
}

.bar{
    width:100%;
    height:12px;
    border-radius:20px;
    overflow:hidden;
    background:#222;
}

.progress{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00d4ff,#7c3aed);
    transition:3s linear;
}

/* STATUS */

.status{
    text-align:center;
    margin-top:18px;
    color:#00ff99;
    font-size:14px;
}

/* FOOTER */

.footer{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:#aaa;
}

</style>
</head>

<body>

<div class="glow1"></div>
<div class="glow2"></div>

<div class="panel">

    <div class="top">

        <div class="logo">iOS PANEL</div>

        <div class="online">
            ● ONLINE
        </div>

    </div>

    <!-- KEY -->

    <div class="key-box">

        <input type="password" id="key"
        placeholder="Nhập key thiết bị">

    </div>

    <!-- FEATURES -->

    <div class="feature">

        <div class="left">
            <h3>FPS BOOST</h3>
            <p>Tối ưu hiệu năng hệ thống</p>
        </div>

        <div class="switch" onclick="toggle(this)"></div>

    </div>

    <div class="feature">

        <div class="left">
            <h3>HUD CUSTOM</h3>
            <p>Tuỳ chỉnh giao diện gaming</p>
        </div>

        <div class="switch" onclick="toggle(this)"></div>

    </div>

    <div class="feature">

        <div class="left">
            <h3>AIM TRAINING</h3>
            <p>Luyện phản xạ & crosshair</p>
        </div>

        <div class="switch" onclick="toggle(this)"></div>

    </div>

    <div class="feature">

        <div class="left">
            <h3>LOW LATENCY</h3>
            <p>Giảm delay mô phỏng</p>
        </div>

        <div class="switch" onclick="toggle(this)"></div>

    </div>

    <!-- BUTTON -->

    <button class="activate" onclick="activateGame()">

        KÍCH HOẠT VÀO GAME

    </button>

    <!-- LOADING -->

    <div class="loading" id="loading">

        <div class="bar">
            <div class="progress" id="progress"></div>
        </div>

    </div>

    <!-- STATUS -->

    <div class="status" id="status">
        SYSTEM READY
    </div>

    <!-- FOOTER -->

    <div class="footer">

        <span>DEVICE: IOS-2026</span>

        <span id="ping">
            PING: 22MS
        </span>

    </div>

</div>

<!-- SOUND -->

<audio id="clickSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg">
</audio>

<audio id="activeSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" type="audio/mpeg">
</audio>

<script>

/* SWITCH */

function toggle(el){

    el.classList.toggle("active");

    document.getElementById("clickSound").play();
}

/* ACTIVATE */

function activateGame(){

    const key = document.getElementById("key").value;

    const status = document.getElementById("status");

    const loading = document.getElementById("loading");

    const progress = document.getElementById("progress");

    if(key !== "IOSVIP2026"){

        status.style.color = "red";

        status.innerHTML = "KEY KHÔNG HỢP LỆ";

        return;
    }

    document.getElementById("activeSound").play();

    status.style.color = "#00ff99";

    status.innerHTML = "ĐANG LIÊN KẾT VÀO GAME...";

    loading.style.display = "block";

    setTimeout(()=>{

        progress.style.width = "100%";

    },100);

    setTimeout(()=>{

        status.innerHTML = "LIÊN KẾT THÀNH CÔNG";

        alert("Đã kích hoạt hệ thống!");

    },3200);
}

/* RANDOM PING */

setInterval(()=>{

    let ping = Math.floor(Math.random()*20)+15;

    document.getElementById("ping").innerHTML =
    "PING: "+ping+"MS";

},1500);

</script>

</body>
</html>
