<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FF MENU KEY SYSTEM</title>

<style>

body{
    margin:0;
    padding:0;
    background:#0d0d0d;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.box{
    width:340px;
    background:#1a1a1a;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 25px red;
    color:white;
}

.title{
    text-align:center;
    font-size:28px;
    color:#ff2e2e;
    font-weight:bold;
    margin-bottom:20px;
}

.input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    background:#2b2b2b;
    color:white;
    margin-bottom:15px;
    box-sizing:border-box;
}

.btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:red;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#ff3c3c;
}

.status{
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.menu{
    display:none;
    margin-top:20px;
}

.feature{
    background:#252525;
    padding:15px;
    border-radius:10px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.switch{
    position:relative;
    width:50px;
    height:25px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    cursor:pointer;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:#555;
    transition:.4s;
    border-radius:25px;
}

.slider:before{
    position:absolute;
    content:"";
    height:19px;
    width:19px;
    left:3px;
    bottom:3px;
    background:white;
    transition:.4s;
    border-radius:50%;
}

input:checked + .slider{
    background:red;
}

input:checked + .slider:before{
    transform:translateX(24px);
}

.device{
    font-size:12px;
    color:#999;
    margin-top:10px;
    text-align:center;
    word-break:break-all;
}

</style>
</head>

<body>

<div class="box">

    <div class="title">
        FF VIP MENU
    </div>

    <input
        type="text"
        id="keyInput"
        class="input"
        placeholder="Nhập key..."
    >

    <button class="btn" onclick="loginKey()">
        LOGIN KEY
    </button>

    <div class="status" id="status"></div>

    <div class="device" id="device"></div>

    <div class="menu" id="menu">

        <div class="feature">
            AIMBOT
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="feature">
            AIM HEAD
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="feature">
            NO RECOIL
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="feature">
            ESP LINE
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="feature">
            FAST SWITCH
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

    </div>

</div>

<script>

// ===== DEVICE ID =====

let deviceId = localStorage.getItem("deviceId");

if(!deviceId){

    deviceId =
        "DEV-" +
        Math.random()
        .toString(36)
        .substring(2,12);

    localStorage.setItem(
        "deviceId",
        deviceId
    );
}

document.getElementById("device").innerHTML =
"DEVICE ID:<br>" + deviceId;


// ===== DATABASE DEMO =====

let keys = {

    "KEY-1DAY": {
        device: null
    },

    "KEY-7DAY": {
        device: null
    },

    "KEY-30DAY": {
        device: null
    },

    "KEY-VIP": {
        device: null
    }

};


// ===== LOGIN =====

function loginKey(){

    let key =
        document
        .getElementById("keyInput")
        .value;

    let status =
        document
        .getElementById("status");

    let menu =
        document
        .getElementById("menu");

    if(!keys[key]){

        status.innerHTML =
        "❌ Key không tồn tại";

        status.style.color = "red";

        return;
    }

    // chưa có thiết bị
    if(keys[key].device === null){

        keys[key].device = deviceId;

        status.innerHTML =
        "✅ Kích hoạt thành công";

        status.style.color = "lime";

        menu.style.display = "block";

        return;
    }

    // đúng thiết bị
    if(keys[key].device === deviceId){

        status.innerHTML =
        "✅ Key hợp lệ";

        status.style.color = "lime";

        menu.style.display = "block";

        return;
    }

    // khác thiết bị
    status.innerHTML =
    "❌ Key đã dùng trên thiết bị khác";

    status.style.color = "red";
}

</script>

</body>
</html>
