<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>UCHIHA KEY</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:#090204;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    color:white;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top,
    #650016 0%,
    transparent 40%),

    radial-gradient(circle at bottom,
    #2a0008 0%,
    transparent 45%);

    z-index:-1;
}

/* CONTAINER */

.key-container{
    width:100%;
    max-width:420px;
    padding:20px;
}

/* BOX */

.key-box{

    background:
    linear-gradient(
    145deg,
    #1d070b,
    #120305);

    border-radius:35px;

    padding:35px 28px;

    border:
    1px solid
    rgba(255,90,120,.25);

    box-shadow:
    0 0 40px
    rgba(255,0,90,.18);

    position:relative;
    overflow:hidden;
}

/* GLOW */

.key-box::before{
    content:"";
    position:absolute;
    width:200px;
    height:200px;

    background:
    rgba(255,0,90,.12);

    border-radius:50%;

    top:-70px;
    right:-70px;

    filter:blur(30px);
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:28px;
}

.logo h1{
    font-size:42px;
    letter-spacing:6px;
    margin-bottom:8px;
}

.logo p{
    color:#ffb7c6;
    font-size:14px;
    letter-spacing:2px;
}

/* INPUT */

.input-box{
    margin-top:25px;
}

.input-box input{

    width:100%;
    height:58px;

    border:none;
    outline:none;

    border-radius:18px;

    background:#25080d;

    color:white;

    padding:18px;

    font-size:15px;

    border:
    1px solid
    rgba(255,90,120,.18);

    box-shadow:
    inset 0 0 15px
    rgba(255,0,90,.08);
}

/* BUTTON */

.activate-btn{

    width:100%;
    height:58px;

    border:none;
    outline:none;

    margin-top:20px;

    border-radius:18px;

    font-size:16px;
    font-weight:700;

    color:white;

    background:
    linear-gradient(
    145deg,
    #ff3f69,
    #820020);

    box-shadow:
    0 0 25px
    rgba(255,0,90,.4);

    transition:.3s;
}

.activate-btn:hover{

    transform:scale(1.03);

}

/* INFO */

.info-panel{

    margin-top:28px;

    background:
    rgba(255,255,255,.03);

    border-radius:22px;

    padding:18px;
}

.info-item{

    display:flex;
    justify-content:space-between;

    margin-bottom:15px;

    font-size:14px;
}

.info-item:last-child{
    margin-bottom:0;
}

.info-item span:first-child{
    color:#ff9ab1;
}

/* STATUS */

#status{

    margin-top:20px;

    text-align:center;

    font-weight:700;

    letter-spacing:1px;
}

/* KEY TYPES */

.key-types{

    margin-top:28px;

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.key-card{

    background:
    linear-gradient(
    145deg,
    #26080d,
    #120305);

    border-radius:22px;

    padding:18px;

    text-align:center;

    border:
    1px solid
    rgba(255,90,120,.18);

    box-shadow:
    0 0 18px
    rgba(255,0,90,.1);
}

.key-card h3{
    margin-bottom:8px;
    font-size:16px;
}

.key-card p{
    color:#ffb8c7;
    font-size:13px;
}

/* FOOTER */

.footer{

    margin-top:25px;

    text-align:center;

    color:#ff95ad;

    font-size:13px;
}

/* ANIMATION */

@keyframes glow{

    0%{
        box-shadow:
        0 0 15px
        rgba(255,0,90,.2);
    }

    50%{
        box-shadow:
        0 0 35px
        rgba(255,0,90,.45);
    }

    100%{
        box-shadow:
        0 0 15px
        rgba(255,0,90,.2);
    }

}

.key-box{
    animation:glow 3s infinite;
}

</style>
</head>
<body>

<div class="key-container">

    <div class="key-box">

        <!-- LOGO -->

        <div class="logo">

            <h1>UCHIHA</h1>

            <p>PREMIUM KEY SYSTEM</p>

        </div>

        <!-- INPUT -->

        <div class="input-box">

            <input
            type="text"
            id="keyInput"
            placeholder="Nhập key tại đây...">

        </div>

        <!-- BUTTON -->

        <button
        class="activate-btn"
        onclick="checkKey()">

            KÍCH HOẠT KEY

        </button>

        <!-- STATUS -->

        <div id="status"></div>

        <!-- INFO -->

        <div class="info-panel">

            <div class="info-item">
                <span>STATUS</span>
                <span>ONLINE 🟢</span>
            </div>

            <div class="info-item">
                <span>VERSION</span>
                <span>UCHIHA V3</span>
            </div>

            <div class="info-item">
                <span>SECURITY</span>
                <span>PREMIUM</span>
            </div>

        </div>

        <!-- KEY TYPES -->

        <div class="key-types">

            <div class="key-card">
                <h3>1 DAY</h3>
                <p>Basic access</p>
            </div>

            <div class="key-card">
                <h3>7 DAY</h3>
                <p>VIP access</p>
            </div>

            <div class="key-card">
                <h3>30 DAY</h3>
                <p>Premium access</p>
            </div>

            <div class="key-card">
                <h3>LIFETIME</h3>
                <p>Unlimited access</p>
            </div>

        </div>

        <!-- FOOTER -->

        <div class="footer">

            UCHIHA GAMING PANEL © 2026

        </div>

    </div>

</div>

<script>

// KEY LIST

const keys = {

    "VIP-1DAY":{
        duration:1
    },

    "VIP-7DAY":{
        duration:7
    },

    "VIP-30DAY":{
        duration:30
    },

    "VIP-LIFETIME":{
        duration:99999
    }

};

// CHECK KEY

function checkKey(){

    const input =
    document.getElementById(
    "keyInput").value;

    const status =
    document.getElementById(
    "status");

    if(keys[input]){

        const now = Date.now();

        const expire =
        now +
        keys[input].duration *
        24 * 60 * 60 * 1000;

        localStorage.setItem(
        "userKey",
        input
        );

        localStorage.setItem(
        "expire",
        expire
        );

        status.innerHTML =
        "KEY HỢP LỆ ✅";

        status.style.color =
        "#55ff99";

        setTimeout(()=>{

            window.location.href =
            "index.html";

        },1500);

    }else{

        status.innerHTML =
        "KEY KHÔNG HỢP LỆ ❌";

        status.style.color =
        "#ff5577";

    }

}

// CHECK EXPIRE

const expire =
localStorage.getItem(
"expire"
);

if(expire){

    if(Date.now() >
    Number(expire)){

        alert(
        "KEY ĐÃ HẾT HẠN"
        );

        localStorage.clear();

    }

}

</script>

</body>
</html>
